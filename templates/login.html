<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administrator Login - LifeLink</title>
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script defer src="{{ url_for('static', filename='js/icons.js') }}"></script>
</head>
<body class="login-page">
  <section class="login-card">
    <div class="brand-mark"><i data-lucide="heart-pulse"></i></div>
    <h1 style="text-align:center">LifeLink Blood Bank</h1>
    <p style="text-align:center">Administrator portal</p>
    <div id="loginAlert"></div>
    <form id="loginForm">
      <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit"><i data-lucide="log-in"></i> Sign In</button>
    </form>
  </section>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.renderIcons) renderIcons();
    });
    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = Object.fromEntries(new FormData(event.target));
      const response = await fetch("/api/auth/login", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const data = await response.json();
      if (response.ok) location.href = "/";
      else document.getElementById("loginAlert").innerHTML = `<div class="alert alert-error">${data.error}</div>`;
    });
  </script>
</body>
</html>
