<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}LifeLink Blood Bank{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script defer src="{{ url_for('static', filename='js/icons.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark"><i data-lucide="heart-pulse"></i></span> LifeLink</div>
    <nav class="nav">
      <a href="/" class="{% if active=='dashboard' %}active{% endif %}"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="/inventory/add" class="{% if active=='add' %}active{% endif %}"><i data-lucide="circle-plus"></i> Add Donation</a>
      <a href="/inventory/manage" class="{% if active=='manage' %}active{% endif %}"><i data-lucide="package"></i> Manage Inventory</a>
      <a href="/profile" class="{% if active=='profile' %}active{% endif %}"><i data-lucide="building-2"></i> Blood Bank Profile</a>
      <a href="/api-documentation" class="{% if active=='docs' %}active{% endif %}"><i data-lucide="book-open"></i> API Documentation</a>
    </nav>
    <div class="sidebar-footer">
      <a class="nav" href="#" id="logout"><i data-lucide="log-out"></i> Logout</a>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="mobile-menu" id="mobileMenu"><i data-lucide="menu"></i></button>
        <h1>{% block heading %}Dashboard{% endblock %}</h1>
      </div>
      <span class="badge">Administrator</span>
    </header>
    <div class="content">{% block content %}{% endblock %}</div>
  </main>
</div>
</body>
</html>
